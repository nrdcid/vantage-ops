[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-ops"
version = "0.1.0"
description = "Phase 0 scaffold for an aviation predictive-operations decision-support system"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
download-data = "vantage.data_sources:main"
check-join-keys = "vantage.join_keys:main"
build-dataset = "vantage.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["config", "data_sources", "join_keys", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
